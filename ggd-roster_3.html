<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goose Goose Duck 유저</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,600;0,6..12,700;1,6..12,600&display=swap" rel="stylesheet">
<style>
  :root{
    --pond: #eef3ea;
    --pond-deep: #dfe9dc;
    --card: #fffdf7;
    --ink: #21301f;
    --ink-soft: #5a6b56;
    --yolk: #f4b400;
    --yolk-deep: #d99500;
    --water: #3f7cae;
    --water-deep: #2f5f88;
    --danger: #c15a4a;
    --line: #d7e0d1;
    --radius: 18px;
    --shadow: 0 2px 0 var(--pond-deep), 0 10px 24px -14px rgba(33,48,31,0.35);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 12% -6%, #fff9e6 0%, transparent 40%),
      radial-gradient(circle at 100% 0%, #e3eee0 0%, transparent 45%),
      var(--pond);
    color:var(--ink);
    font-family:'Nunito Sans', sans-serif;
    min-height:100vh;
    padding:32px 18px 60px;
  }
  .wrap{max-width:840px;margin:0 auto;}

  /* Header / signature element: a "roster board" strip with webbed-footprint ticks */
  header{
    position:relative;
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:26px 28px 22px;
    margin-bottom:24px;
    overflow:hidden;
    border:1px solid var(--line);
  }
  header::before{
    content:"";
    position:absolute;
    top:0;left:0;right:0;height:8px;
    background:repeating-linear-gradient(90deg,var(--yolk) 0 22px, var(--water) 22px 44px);
    opacity:.9;
  }
  h1{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:clamp(24px,4vw,32px);
    margin:6px 0 4px;
    letter-spacing:.2px;
  }
  header p{
    margin:0;
    color:var(--ink-soft);
    font-size:14.5px;
  }
  .count-pill{
    position:absolute;
    top:24px;right:26px;
    background:var(--pond);
    border:1px solid var(--line);
    border-radius:999px;
    padding:6px 14px;
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:13px;
    color:var(--water-deep);
  }

  /* Toolbar */
  .toolbar{
    display:flex;
    gap:10px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  .search{
    flex:1 1 220px;
    position:relative;
  }
  .search input{
    width:100%;
    padding:12px 14px 12px 38px;
    border-radius:14px;
    border:1px solid var(--line);
    background:var(--card);
    font-family:'Nunito Sans',sans-serif;
    font-size:14.5px;
    color:var(--ink);
    outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  .search input:focus{
    border-color:var(--water);
    box-shadow:0 0 0 3px rgba(63,124,174,.15);
  }
  .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.5;}

  .add-btn{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--yolk);
    color:#3a2900;
    border:none;
    border-radius:14px;
    padding:12px 18px;
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:14.5px;
    cursor:pointer;
    box-shadow:0 3px 0 var(--yolk-deep);
    transition:transform .08s;
  }
  .add-btn:hover{filter:brightness(1.03);}
  .add-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--yolk-deep);}

  /* Form panel */
  .panel{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px;
    margin-bottom:20px;
    box-shadow:var(--shadow);
    display:none;
  }
  .panel.open{display:block;}
  .panel h2{
    font-family:'Baloo 2',sans-serif;
    font-size:17px;
    margin:0 0 16px;
  }
  .grid2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  @media (max-width:520px){ .grid2{grid-template-columns:1fr;} }
  .field label{
    display:block;
    font-size:12.5px;
    font-weight:700;
    color:var(--ink-soft);
    margin-bottom:6px;
    text-transform:uppercase;
    letter-spacing:.4px;
  }
  .field input, .field textarea, .field select{
    width:100%;
    padding:10px 12px;
    border-radius:10px;
    border:1px solid var(--line);
    background:#fff;
    font-family:'Nunito Sans',sans-serif;
    font-size:14.5px;
    color:var(--ink);
    outline:none;
  }
  .field input:focus, .field textarea:focus, .field select:focus{
    border-color:var(--water);
    box-shadow:0 0 0 3px rgba(63,124,174,.15);
  }
  .field textarea{resize:vertical;min-height:64px;font-family:inherit;}
  .panel-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:18px;
  }
  .btn{
    border:none;border-radius:12px;
    padding:10px 16px;
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
  }
  .btn-primary{background:var(--water);color:#fff;box-shadow:0 3px 0 var(--water-deep);}
  .btn-primary:active{transform:translateY(2px);box-shadow:0 1px 0 var(--water-deep);}
  .btn-ghost{background:transparent;color:var(--ink-soft);}
  .btn-ghost:hover{color:var(--ink);}

  /* Roster list */
  .list{display:flex;flex-direction:column;gap:12px;}
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px 18px;
    display:flex;
    align-items:flex-start;
    gap:14px;
    box-shadow:0 1px 0 var(--pond-deep);
    transition:transform .1s, box-shadow .1s;
  }
  .card:hover{transform:translateY(-1px);box-shadow:0 6px 16px -10px rgba(33,48,31,.4);}
  .avatar{
    flex:none;
    width:44px;height:44px;
    border-radius:50%;
    background:linear-gradient(160deg,var(--yolk),var(--yolk-deep));
    display:flex;align-items:center;justify-content:center;
    font-family:'Baloo 2',sans-serif;
    font-weight:800;
    color:#3a2900;
    font-size:17px;
  }
  .card-body{flex:1;min-width:0;}
  .card-top{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    margin-bottom:2px;
  }
  .nickname{
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:16.5px;
  }
  .userid{
    font-size:13px;
    color:var(--ink-soft);
    background:var(--pond);
    padding:2px 8px;
    border-radius:8px;
  }
  .level-badge{
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:12px;
    color:#fff;
    background:var(--water);
    padding:3px 10px;
    border-radius:999px;
  }
  .date-tag{
    font-size:12px;
    color:var(--ink-soft);
    background:var(--pond);
    padding:3px 9px;
    border-radius:999px;
  }
  .desc{
    margin-top:6px;
    font-size:13.5px;
    color:var(--ink-soft);
    line-height:1.5;
    white-space:pre-wrap;
    word-break:break-word;
  }
  .card-actions{
    flex:none;
    display:flex;
    gap:6px;
  }
  .icon-btn{
    width:32px;height:32px;
    border-radius:9px;
    border:1px solid var(--line);
    background:#fff;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    color:var(--ink-soft);
    transition:background .12s,color .12s;
  }
  .icon-btn:hover{background:var(--pond);color:var(--ink);}
  .icon-btn.danger:hover{background:#fbeae6;color:var(--danger);}

  .empty{
    text-align:center;
    padding:50px 20px;
    color:var(--ink-soft);
    background:var(--card);
    border:1px dashed var(--line);
    border-radius:var(--radius);
    font-size:14.5px;
  }
  .empty b{display:block;font-family:'Baloo 2',sans-serif;color:var(--ink);font-size:16px;margin-bottom:6px;}

  .status{
    text-align:center;
    font-size:12.5px;
    color:var(--ink-soft);
    margin-top:22px;
  }
  .status.err{color:var(--danger);}

  footer{
    text-align:center;
    margin-top:30px;
    font-size:12px;
    color:var(--ink-soft);
    opacity:.8;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="count-pill" id="countPill">0명</span>
    <h1>🦢 Goose Goose Duck 유저</h1>
    <button id="copyLinkBtn" style="margin-top:10px;display:inline-flex;align-items:center;gap:6px;background:var(--pond);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-family:'Nunito Sans',sans-serif;font-weight:700;font-size:12.5px;color:var(--water-deep);cursor:pointer;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M10 13a5 5 0 0 0 7.07 0l2.83-2.83a5 5 0 0 0-7.07-7.07l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.07 0L4.1 13.83a5 5 0 0 0 7.07 7.07l1.5-1.5"/></svg>
      이 목록 공유 링크 복사
    </button>
  </header>

  <div class="toolbar">
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="searchInput" type="text" placeholder="닉네임 또는 아이디로 검색">
    </div>
    <button class="add-btn" id="openAddBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      유저 추가
    </button>
  </div>

  <div class="panel" id="formPanel">
    <h2 id="formTitle">새 유저 추가</h2>
    <div class="grid2">
      <div class="field">
        <label>닉네임</label>
        <input id="f-nickname" type="text" placeholder="예: 꽥꽥이">
      </div>
      <div class="field">
        <label>아이디</label>
        <input id="f-id" type="text" placeholder="예: quack_1234">
      </div>
      <div class="field">
        <label>레벨</label>
        <input id="f-level" type="text" placeholder="예: 42">
      </div>
    </div>
    <div class="field" style="margin-top:14px;">
      <label>부가 설명</label>
      <textarea id="f-desc" placeholder="플레이 스타일, 만난 계기, 주의사항 등 자유롭게"></textarea>
    </div>
    <div class="panel-actions">
      <button class="btn btn-ghost" id="cancelBtn">취소</button>
      <button class="btn btn-primary" id="saveBtn">저장</button>
    </div>
  </div>

  <div class="list" id="listEl"></div>
  <div class="empty" id="emptyEl" style="display:none;">
    <b>아직 등록된 유저가 없어요</b>
    함께 게임하는 친구들을 하나씩 추가해보세요.
  </div>

  <div class="status" id="statusEl"></div>
  <footer>이 페이지 링크를 아는 모든 사람이 목록을 함께 보고 수정할 수 있어요.</footer>
</div>

<script>
const API_BASE = 'https://jsonblob.com/api/jsonBlob';
let players = [];
let editingId = null;
let boardId = null;

const listEl = document.getElementById('listEl');
const emptyEl = document.getElementById('emptyEl');
const countPill = document.getElementById('countPill');
const statusEl = document.getElementById('statusEl');
const panel = document.getElementById('formPanel');
const formTitle = document.getElementById('formTitle');
const searchInput = document.getElementById('searchInput');
const copyLinkBtn = document.getElementById('copyLinkBtn');

function setStatus(msg, isErr){
  statusEl.textContent = msg || '';
  statusEl.className = 'status' + (isErr ? ' err' : '');
}

function initials(name){
  if(!name) return '?';
  return name.trim().slice(0,1).toUpperCase();
}

function formatDate(ts){
  if(!ts) return '';
  const d = new Date(ts);
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}.${m}.${day}`;
}

function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

async function ensureBoard(){
  const params = new URLSearchParams(location.search);
  const existing = params.get('board');
  if(existing){
    boardId = existing;
    return;
  }
  setStatus('공유 목록을 처음 만드는 중...');
  try{
    const res = await fetch(API_BASE, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify([])
    });
    const loc = res.headers.get('Location') || res.headers.get('location') || res.url;
    boardId = loc.split('/').filter(Boolean).pop();
    const url = new URL(location.href);
    url.searchParams.set('board', boardId);
    history.replaceState(null, '', url.toString());
  }catch(e){
    setStatus('공유 목록 생성에 실패했어요. 새로고침해서 다시 시도해주세요.', true);
  }
}

async function loadPlayers(){
  if(!boardId) return;
  setStatus('불러오는 중...');
  try{
    const res = await fetch(`${API_BASE}/${boardId}`);
    players = res.ok ? await res.json() : [];
  }catch(e){
    players = [];
    setStatus('목록을 불러오지 못했어요. 새로고침 해주세요.', true);
  }
  setStatus('');
  render();
}

async function savePlayers(){
  if(!boardId) return false;
  try{
    const res = await fetch(`${API_BASE}/${boardId}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(players)
    });
    if(!res.ok){
      setStatus('저장에 실패했어요. 다시 시도해주세요.', true);
      return false;
    }
    return true;
  }catch(e){
    setStatus('저장 중 오류가 발생했어요.', true);
    return false;
  }
}

function render(){
  const q = searchInput.value.trim().toLowerCase();
  const filtered = players.filter(p =>
    !q || p.nickname.toLowerCase().includes(q) || p.id.toLowerCase().includes(q)
  );

  countPill.textContent = players.length + '명';

  if(filtered.length === 0){
    listEl.innerHTML = '';
    emptyEl.style.display = 'block';
    if(q && players.length){
      emptyEl.innerHTML = '<b>검색 결과가 없어요</b>다른 검색어로 시도해보세요.';
    }else{
      emptyEl.innerHTML = '<b>아직 등록된 유저가 없어요</b>함께 게임하는 친구들을 하나씩 추가해보세요.';
    }
    return;
  }
  emptyEl.style.display = 'none';

  listEl.innerHTML = filtered.map(p => `
    <div class="card" data-id="${p.pid}">
      <div class="avatar">${escapeHtml(initials(p.nickname))}</div>
      <div class="card-body">
        <div class="card-top">
          <span class="nickname">${escapeHtml(p.nickname)}</span>
          <span class="userid">@${escapeHtml(p.id)}</span>
          ${p.level ? `<span class="level-badge">Lv. ${escapeHtml(p.level)}</span>` : ''}
          ${p.createdAt ? `<span class="date-tag">${formatDate(p.createdAt)} 등록</span>` : ''}
        </div>
        ${p.desc ? `<div class="desc">${escapeHtml(p.desc)}</div>` : ''}
      </div>
      <div class="card-actions">
        <button class="icon-btn" data-action="edit" title="수정">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </button>
        <button class="icon-btn danger" data-action="delete" title="삭제">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
        </button>
      </div>
    </div>
  `).join('');
}

function openForm(edit){
  editingId = null;
  document.getElementById('f-nickname').value = '';
  document.getElementById('f-id').value = '';
  document.getElementById('f-level').value = '';
  document.getElementById('f-desc').value = '';
  formTitle.textContent = '새 유저 추가';

  if(edit){
    editingId = edit.pid;
    document.getElementById('f-nickname').value = edit.nickname;
    document.getElementById('f-id').value = edit.id;
    document.getElementById('f-level').value = edit.level;
    document.getElementById('f-desc').value = edit.desc;
    formTitle.textContent = '유저 정보 수정';
  }
  panel.classList.add('open');
  document.getElementById('f-nickname').focus();
}

function closeForm(){
  panel.classList.remove('open');
  editingId = null;
}

document.getElementById('openAddBtn').addEventListener('click', () => openForm(null));
document.getElementById('cancelBtn').addEventListener('click', closeForm);

document.getElementById('saveBtn').addEventListener('click', async () => {
  const nickname = document.getElementById('f-nickname').value.trim();
  const id = document.getElementById('f-id').value.trim();
  const level = document.getElementById('f-level').value.trim();
  const desc = document.getElementById('f-desc').value.trim();

  if(!nickname || !id){
    setStatus('닉네임과 아이디는 꼭 입력해주세요.', true);
    return;
  }

  if(editingId){
    const idx = players.findIndex(p => p.pid === editingId);
    if(idx > -1){
      players[idx] = { ...players[idx], nickname, id, level, desc };
    }
  }else{
    players.unshift({
      pid: 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
      nickname, id, level, desc,
      createdAt: Date.now()
    });
  }

  const ok = await savePlayers();
  if(ok){
    setStatus('저장됐어요.');
    closeForm();
    render();
    setTimeout(() => setStatus(''), 1500);
  }
});

listEl.addEventListener('click', async (e) => {
  const btn = e.target.closest('.icon-btn');
  if(!btn) return;
  const card = e.target.closest('.card');
  const pid = card.dataset.id;
  const player = players.find(p => p.pid === pid);
  if(!player) return;

  if(btn.dataset.action === 'edit'){
    openForm(player);
  }else if(btn.dataset.action === 'delete'){
    if(confirm(`'${player.nickname}' 유저를 목록에서 삭제할까요?`)){
      players = players.filter(p => p.pid !== pid);
      const ok = await savePlayers();
      if(ok) render();
    }
  }
});

searchInput.addEventListener('input', render);

copyLinkBtn.addEventListener('click', async () => {
  try{
    await navigator.clipboard.writeText(location.href);
    const original = copyLinkBtn.innerHTML;
    copyLinkBtn.textContent = '링크가 복사됐어요!';
    setTimeout(() => { copyLinkBtn.innerHTML = original; }, 1800);
  }catch(e){
    setStatus('복사에 실패했어요. 주소창의 링크를 직접 복사해주세요.', true);
  }
});

(async function init(){
  await ensureBoard();
  await loadPlayers();
})();
</script>
</body>
</html>
